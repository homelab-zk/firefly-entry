<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f1115">
<title>Entry</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>

<section id="lock" class="screen hidden">
  <h1>Entry</h1>
  <p class="muted">Locked</p>
  <button id="btn-finger" class="big hidden">Unlock with fingerprint</button>
  <form id="pin-form" autocomplete="off">
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="PIN" autocomplete="off" aria-label="PIN">
    <button class="big" type="submit">Unlock</button>
  </form>
  <p id="lock-msg" class="error"></p>
</section>

<section id="form" class="screen hidden">
  <h1>New entry</h1>
  <div class="seg" role="radiogroup" aria-label="Type">
    <button type="button" data-type="withdrawal" class="on">Debit</button>
    <button type="button" data-type="deposit">Credit</button>
    <button type="button" data-type="transfer">Transfer</button>
  </div>

  <div id="debit-box">
    <label for="debit-select">Debit account <span class="muted" id="debit-hint">money leaves</span></label>
    <select id="debit-select"></select>
  </div>
  <div id="credit-box">
    <label for="credit-select">Credit account <span class="muted" id="credit-hint">money arrives</span></label>
    <select id="credit-select"></select>
  </div>
  <p class="muted">Date, amount, currency and shop are read from the photo on the next screens.</p>

  <p id="form-msg" class="error"></p>
  <button id="btn-next" class="big">Next: photo</button>
  <button id="btn-manual" class="big alt">Manual entry (no receipt)</button>
  <div class="links">
    <button id="btn-setup-finger" class="link hidden">Add fingerprint for this phone</button>
    <button id="btn-change-pin" class="link">Change PIN</button>
    <button id="btn-lock" class="link">Lock now</button>
  </div>
</section>

<section id="pinchange" class="screen hidden">
  <h1>Change PIN</h1>
  <form id="pinchange-form" autocomplete="off">
    <label for="pin-cur">Current PIN</label>
    <input id="pin-cur" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
    <label for="pin-new">New PIN <span class="muted">at least 4 digits</span></label>
    <input id="pin-new" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
    <label for="pin-new2">Repeat new PIN</label>
    <input id="pin-new2" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
    <p id="pinchange-msg" class="error"></p>
    <button class="big" type="submit">Change PIN</button>
  </form>
  <button id="btn-pinchange-back" class="link">Back</button>
</section>

<section id="photo" class="screen hidden">
  <h1>Receipt photo</h1>
  <p class="muted" id="photo-summary"></p>
  <label class="big file">Take picture
    <input id="file-cam" type="file" accept="image/*" capture="environment">
  </label>
  <label class="big file alt">Upload from gallery
    <input id="file-up" type="file" accept="image/*">
  </label>
  <p id="photo-msg" class="error"></p>
  <button id="btn-photo-back" class="link">Back</button>
</section>

<section id="confirm" class="screen hidden">
  <h1 id="confirm-title">Confirm</h1>
  <p class="muted" id="confirm-summary"></p>
  <img id="thumb" alt="Receipt photo, tap to enlarge" class="thumb">
  <p class="muted center" id="thumb-hint">Tap the photo to enlarge</p>
  <p id="reading" class="status"><span class="spin"></span> Reading receipt...</p>
  <label for="date">Date <span class="muted" id="date-hint"></span></label>
  <input id="date" type="date">
  <div id="party-box">
    <label for="party" id="party-label">Paid to</label>
    <input id="party" list="party-list" placeholder="Type or pick a name" autocomplete="off">
    <datalist id="party-list"></datalist>
    <p class="muted hint" id="party-hint"></p>
  </div>
  <div id="rcur-box">
    <label for="rcur">Receipt currency <span class="muted" id="rcur-hint"></span></label>
    <select id="rcur"></select>
  </div>
  <div id="foreign-box" class="hidden">
    <label for="foreign-amount" id="foreign-label">Total on receipt</label>
    <div class="amt"><span id="fcur-label"></span><input id="foreign-amount" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>
  </div>
  <label for="amount" id="amount-label">Total</label>
  <div class="amt"><span id="cur-label"></span><input id="amount" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>
  <label for="desc">Description</label>
  <input id="desc" placeholder="Receipt" autocomplete="off">
  <p id="confirm-msg" class="error"></p>
  <button id="btn-save" class="big" disabled>Save to Firefly</button>
  <button id="btn-confirm-back" class="link">Start over</button>
</section>

<section id="done" class="screen hidden">
  <h1>Saved</h1>
  <p id="done-msg" class="muted">Transaction added.</p>
  <button id="btn-again" class="big">Add another</button>
</section>

</main>

<div id="viewer" class="viewer hidden" role="dialog" aria-label="Receipt photo">
  <button id="viewer-close" class="viewer-close" aria-label="Close">&times;</button>
  <div id="viewer-scroll" class="viewer-scroll"><img id="viewer-img" alt="Receipt photo"></div>
  <p class="viewer-tip">Tap to zoom in or out, drag to move. Pinch also works.</p>
</div>
<script src="/static/app.js"></script>
</body>
</html>
